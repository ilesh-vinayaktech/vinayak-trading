name: ci
on:
  pull_request:
  push:
  schedule: [{cron: "0 20 * * *"}]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: sudo apt-get install -y poppler-utils  # pdftotext, used to read NSE press releases
      - run: uv sync --frozen
      - run: make check
  nightly-mutation:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --frozen && make mut
