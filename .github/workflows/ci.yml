name: ci
on:
  pull_request:
  push:
  schedule: [{cron: "0 20 * * *"}]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: sudo apt-get install -y poppler-utils  # pdftotext, used to read NSE press releases
      - run: uv sync --frozen
      - run: make check
      - name: Coverage summary on the run page (T0.10)
        if: always()
        run: uv run coverage report --format=markdown --skip-covered >> "$GITHUB_STEP_SUMMARY"
      - name: Coverage report as HTML
        if: always()
        run: uv run coverage html -d htmlcov
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-html
          path: htmlcov
  frontend:  # the same steps as `make console-check`: types, lint, tests, production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npx vitest run
      - run: npx next build
  nightly-mutation:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --frozen && make mut
