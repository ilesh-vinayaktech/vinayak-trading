[project]
name = "algo"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "argon2-cffi>=23.1",
    "cryptography>=43",
    "fastapi>=0.162.2",
    "lightgbm>=4.7.0",
    "numpy==2.2.6",
    "pandas>=3.1.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "uvicorn[standard]>=0.54.0",
    "websockets>=13",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-randomly>=3.15",
    "pytest-xdist>=3.6",
    "hypothesis>=6.100",
    "time-machine>=2.14",
    "ruff>=0.6",
    "mypy>=1.11",
    "mutmut>=3",
    "testcontainers[postgres]>=4.8",
    "httpx>=0.28.1",
    "pandas-stubs>=3.1.0.261029",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/algo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -ra"
markers = ["unit", "integration", "e2e", "slow", "fault"]

[tool.coverage.run]
source = ["src/algo"]
branch = true
[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DTZ"]   # DTZ bans naive/system-clock datetime use
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]  # long SQL strings / banners in tests; src stays at 100
"scripts/build_cost_schedules.py" = ["E501"]  # evidence quotes must stay verbatim

[tool.mypy]
strict = true
mypy_path = "src"

[tool.mutmut]
# Pure modules, fast unit tests only. DB-backed modules (reader, review, engine) need a faster
# harness (shared test database) before they are practical to mutate.
paths_to_mutate = [
  "src/algo/data/adjust/factors.py",
  "src/algo/data/quality/continuity.py",
  "src/algo/data/providers/nse_corporate_actions.py",
  "src/algo/backtest/metrics.py",
  "src/algo/strategy/lifecycle.py",
  "src/algo/platform_state/machine.py",
  "src/algo/core/calendar.py",
  "src/algo/core/money.py",
  "src/algo/core/clock.py",
  "src/algo/data/lake.py",
  "src/algo/ledger/ledger.py",
  "src/algo/backtest/costs/schedule.py",
  "src/algo/backtest/costs/calculator.py",
  "src/algo/backtest/costs/slippage.py",
  "src/algo/backtest/costs/policy.py",
  "src/algo/backtest/costs/reconcile.py",
  "src/algo/backtest/costs/scaled.py",
  "src/algo/backtest/validation/stats.py",
  "src/algo/backtest/validation/walkforward.py",
  "src/algo/backtest/validation/robustness.py",
  "src/algo/backtest/validation/gates.py",
  "src/algo/data/universe_derive.py",
  "src/algo/data/providers/nse_index_releases.py",
  "src/algo/data/providers/nse_index_monthly.py",
  "src/algo/data/providers/niftyindices_archive.py",
  "src/algo/data/universe_monthly.py",
  "src/algo/data/providers/niftyindices_tri.py",
  "src/algo/data/providers/niftyindices_price.py",
  "src/algo/data/providers/nse_bhavcopy_legacy.py",
  "src/algo/data/providers/xlsx_table.py",
  "src/algo/data/benchmark_validate.py",
  "src/algo/data/benchmark_compare.py",
  "src/algo/data/benchmark_audit.py",
  "src/algo/data/benchmark_eligibility.py",
  "src/algo/data/calendar_evidence.py",
  "src/algo/indicators/core.py",
  "src/algo/indicators/catalog.py",
  "src/algo/data/sessions.py",
  "src/algo/data/ratios.py",
  "src/algo/data/providers/nse_results.py",
  "src/algo/core/settings.py",
  "src/algo/core/secret_scan.py",
  "src/algo/core/logs.py",
  "src/algo/api/scorecards.py",
  "src/algo/paper/tracking.py",
  "src/algo/risk/checks.py",
  "src/algo/risk/engine.py",
  "src/algo/risk/killswitch.py",
  "src/algo/risk/limits.py",
  "src/algo/risk/realtime.py",
  "src/algo/execution/oms.py",
  "src/algo/execution/orders.py",
  "src/algo/execution/flatten.py",
  "src/algo/execution/reconciler.py",
  "src/algo/execution/live_gate.py",
  "src/algo/execution/live_reconcile.py",
  "src/algo/alpha/stats.py",
  "src/algo/alpha/discover.py",
  "src/algo/factory/dsl.py",
  "src/algo/factory/interpreter.py",
  "src/algo/factory/experiment.py",
  "src/algo/learning/degradation.py",
  "src/algo/learning/ai_gateway.py",
  "src/algo/portfolio/allocation.py",
  "src/algo/portfolio/regime.py",
  "src/algo/portfolio/exposure.py",
]
tests_dir = ["tests/unit/"]
# The sandbox clears the environment in its worker, which removes the variable mutmut's instrumented code reads: those tests crash under mutation
# (and test nothing a mutated module owns), so they are left out of the mutation run only.
pytest_add_cli_args = ["--ignore=tests/unit/sandbox", "--ignore=tests/unit/test_git_hooks.py"]  # the hook test runs `uv run` in a scratch repo, which needs the real project root
also_copy = ["src/", "tests/", "config/", "scripts/", "docs/", ".githooks/", ".github/"]
